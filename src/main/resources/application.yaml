server:
  port: 8080
  forward-headers-strategy: framework

logging:
  file:
    name: logs/application.log
  level:
    root: INFO
    '[com.diplome.game_recommendation]': DEBUG

mail:
  host: smtp.gmail.com
  port: 587
  username: ${SPRING_MAIL_USERNAME}
  password: ${SPRING_MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: journal-logs

gigachat:
  authorization-key: ${GIGACHAT_KEY}

rawg:
  key: ${RAWG_API_KEY}

video:
  key: ${VIDEO_API_KEY}
  
spring:
  application:
    name: game-recommendation
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
news:
  key: ${NEWS_API_KEY}
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/game_recommendation
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update 

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres_db:5432/game_recommendation
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update 
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"